[workspace]
resolver = "2"
members = ["core", "host"]

[workspace.dependencies]
pow-bench-core = { path = "core" }
baseline = { package = "libm", git = "https://github.com/rust-lang/compiler-builtins", rev = "6bc104a50f83cb205790c61c5d33508046f5fad3", default-features = false }
candidate = { package = "libm", path = "../libm", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

