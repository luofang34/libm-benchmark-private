[workspace]
[package]
name = "exp-experiment"
version = "0.1.0"
edition = "2024"
publish = false
[lib]
crate-type = ["rlib", "cdylib"]
[features]
default = ["direct-libm"]
direct-libm = ["dep:libm"]
[dependencies]
libm = { path = "../../../libm", default-features = false, optional = true }
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
[lints]
workspace = true
[workspace.lints.rust]
# The numeric host ABI needs unsafe declarations and symbol attributes.
unsafe_code = "deny"
[workspace.lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
