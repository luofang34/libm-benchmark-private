[workspace]
[package]
name = "exp-fixture"
version = "0.1.0"
edition = "2024"
publish = false
[lib]
crate-type = ["cdylib"]
[features]
exp = []
exp2 = []
medium = ["exp", "exp2"]
application = ["medium", "dep:serde_json"]
[dependencies]
libm = { path = "../../../libm", default-features = false }
serde_json = { version = "1.0", optional = true }
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
[lints]
workspace = true
[workspace.lints.rust]
# Named numeric WASM exports require unsafe symbol attributes.
unsafe_code = "deny"
[workspace.lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
todo = "forbid"
unimplemented = "forbid"
unreachable = "forbid"
exit = "forbid"
mem_forget = "forbid"
get_unwrap = "forbid"
let_underscore_must_use = "deny"
let_underscore_future = "deny"
await_holding_lock = "deny"
