[package]
name = "powbench"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libm = "=0.2.16"
petir = { version = "=0.0.3", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[features]
only-libm = []
only-arm = []
only-std = []
